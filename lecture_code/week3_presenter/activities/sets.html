<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Required and visited stops</title><link rel="stylesheet" href="board.css"><script defer src="board-common.js"></script><script defer src="sets.js"></script></head><body><main>
<header><label for="operation">Operation</label><select id="operation"><option value="difference">required - visited</option><option value="intersection">required &amp; visited</option><option value="union">required | visited</option><option value="symmetric">required ^ visited</option></select><button id="fullscreen">Full screen</button></header>
<div class="split"><div class="venn"><svg viewBox="0 0 640 350" role="img" aria-label="Required contains A, B, C, D. Visited contains A, C, E."><ellipse class="region" cx="235" cy="185" rx="175" ry="145"/><ellipse class="region" cx="405" cy="185" rx="175" ry="145"/><text x="120" y="30">required</text><text x="425" y="30">visited</text></svg><button data-stop="A" style="left:50%;top:38%" aria-pressed="false">A</button><button data-stop="C" style="left:50%;top:68%" aria-pressed="false">C</button><button data-stop="B" style="left:24%;top:38%" aria-pressed="false">B</button><button data-stop="D" style="left:24%;top:68%" aria-pressed="false">D</button><button data-stop="E" style="left:76%;top:53%" aria-pressed="false">E</button></div><section><pre id="code"></pre><p id="meaning"></p><p class="muted">Tap the stops you predict belong in the result.</p><div class="controls"><button id="reveal" class="primary">Reveal result</button><button id="reset">Reset prediction</button></div></section></div>
<p id="status" class="output" aria-live="polite"></p>
</main></body></html>

<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List operations</title><link rel="stylesheet" href="board.css"><script defer src="board-common.js"></script><script defer src="lists.js"></script></head><body><main>
<header><label for="scene">Example</label><select id="scene"><option value="add">Adding elements</option><option value="remove">Inserting and removing</option><option value="iterate">Removal during iteration</option></select><button id="fullscreen">Full screen</button></header>
<div class="controls" id="choices"></div><pre id="code"></pre>
<div class="split"><section><strong id="left-label">Before</strong><div id="before" class="sequence"></div></section><section><strong id="right-label">After</strong><div id="after" class="sequence"></div></section></div>
<div class="controls"><button id="run" class="primary">Run operation</button><button id="reset">Reset</button></div>
<p id="status" class="output" aria-live="polite">Predict the result before running.</p>
</main></body></html>

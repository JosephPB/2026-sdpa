<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img"><title>Preserve raw data separately from processed data and results</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="100" font-size="36" fill="#a71930" text-anchor="start">Raw</text><text x="25" y="165" font-size="28" fill="#242424" text-anchor="start">Original JSON / HTML</text><text x="470" y="100" font-size="36" fill="#a71930" text-anchor="start">Processed</text><text x="470" y="165" font-size="28" fill="#242424" text-anchor="start">Selected, typed columns</text><text x="930" y="100" font-size="36" fill="#a71930" text-anchor="start">Result</text><text x="930" y="165" font-size="28" fill="#242424" text-anchor="start">Table or plot</text><path d="M300,120 L420,120" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M795,120 L900,120" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="25" y="275" font-size="31" fill="#242424" text-anchor="start">Keep the source URL, parameters and retrieval time.</text><text x="25" y="345" font-size="31" fill="#242424" text-anchor="start">A saved raw response lets you repeat the processing.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 280" role="img"><title>JSON text is parsed into Python dictionaries and lists before a DataFrame is constructed</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="15" y="100" font-size="35" fill="#a71930" text-anchor="start">Response</text><text x="15" y="155" font-size="26" fill="#242424" text-anchor="start">JSON text in the body</text><path d="M255,105 L315,105" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="340" y="100" font-size="35" fill="#a71930" text-anchor="start">dict</text><text x="340" y="155" font-size="26" fill="#242424" text-anchor="start">parsed JSON object</text><path d="M580,105 L640,105" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="665" y="100" font-size="35" fill="#a71930" text-anchor="start">list</text><text x="665" y="155" font-size="26" fill="#242424" text-anchor="start">parsed data array</text><path d="M905,105 L965,105" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="990" y="100" font-size="35" fill="#a71930" text-anchor="start">DataFrame</text><text x="990" y="155" font-size="26" fill="#242424" text-anchor="start">records in columns</text><text x="285" y="235" font-size="28" fill="#a71930" text-anchor="middle">response.json()</text><text x="610" y="235" font-size="28" fill="#a71930" text-anchor="middle">payload[&quot;data&quot;]</text><text x="970" y="235" font-size="27" fill="#a71930" text-anchor="middle">pd.DataFrame(...)</text></g></svg>
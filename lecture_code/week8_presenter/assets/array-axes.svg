<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img"><title>An RGB image has row, column and channel axes</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="36" fill="#242424" text-anchor="start">RGB image</text><image href="data:image/png;base64," x="20" y="90" width="360" height="250" style="image-rendering:pixelated"/><path d="M420,210 L580,210" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="650" y="60" font-size="34" fill="#242424" text-anchor="start">shape</text><text x="650" y="130" font-size="44" fill="#242424" text-anchor="start">(</text><text x="800" y="130" font-size="44" fill="#242424" text-anchor="start">,</text><text x="1040" y="130" font-size="44" fill="#242424" text-anchor="start">,</text><text x="1220" y="130" font-size="44" fill="#242424" text-anchor="start">)</text><text x="720" y="130" font-size="44" fill="#a71930" text-anchor="middle">7</text><line x1="720" y1="155" x2="720" y2="215" stroke="#a71930" stroke-width="3"/><text x="720" y="260" font-size="28" fill="#a71930" text-anchor="middle">7 rows</text><text x="940" y="130" font-size="44" fill="#167b83" text-anchor="middle">10</text><line x1="940" y1="155" x2="940" y2="215" stroke="#167b83" stroke-width="3"/><text x="940" y="260" font-size="28" fill="#167b83" text-anchor="middle">10 columns</text><text x="1160" y="130" font-size="44" fill="#bf881c" text-anchor="middle">3</text><line x1="1160" y1="155" x2="1160" y2="215" stroke="#bf881c" stroke-width="3"/><text x="1160" y="260" font-size="28" fill="#bf881c" text-anchor="middle">3 channels</text><text x="650" y="340" font-size="32" fill="#242424" text-anchor="start">RGB[row, column, channel]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img"><title>An HTTP request and response between a Python client and a server</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="45" font-size="36" fill="#242424" text-anchor="start">Python client</text><text x="1010" y="45" font-size="36" fill="#242424" text-anchor="start">Server</text><path d="M250,115 L1000,115" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="625" y="93" font-size="31" fill="#a71930" text-anchor="middle">HTTPS request</text><path d="M1000,320 L250,320" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="625" y="365" font-size="31" fill="#167b83" text-anchor="middle">HTTP response</text><text x="265" y="170" font-size="33" fill="#242424" text-anchor="start">GET  /observations?site=A38</text><text x="265" y="215" font-size="29" fill="#242424" text-anchor="start">Accept: application/json</text><text x="265" y="285" font-size="29" fill="#242424" text-anchor="start">200 OK   ·   Content-Type: application/json</text><text x="35" y="390" font-size="27" fill="#242424" text-anchor="start">Method + URL + headers + optional body</text><text x="730" y="390" font-size="27" fill="#242424" text-anchor="start">Status + headers + body</text></g></svg>
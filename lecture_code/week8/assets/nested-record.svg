<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img"><title>JSON keys and nesting describe a record hierarchy</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="40" font-size="34" fill="#242424" text-anchor="start">A nested record</text><text x="30" y="85" font-size="29" fill="#242424" text-anchor="start">{</text><text x="30" y="126" font-size="29" fill="#242424" text-anchor="start">  &quot;site&quot;: &quot;A38&quot;,</text><text x="30" y="167" font-size="29" fill="#a71930" text-anchor="start">  &quot;counts&quot;: {</text><text x="30" y="208" font-size="29" fill="#a71930" text-anchor="start">    &quot;cars&quot;: 182,</text><text x="30" y="249" font-size="29" fill="#a71930" text-anchor="start">    &quot;bicycles&quot;: 10</text><text x="30" y="290" font-size="29" fill="#a71930" text-anchor="start">  }</text><text x="30" y="331" font-size="29" fill="#242424" text-anchor="start">}</text><path d="M520,200 L650,200" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="745" y="75" font-size="34" fill="#242424" text-anchor="start">observation</text><line x1="835" y1="90" x2="835" y2="135" stroke="#aaa" stroke-width="2"/><line x1="745" y1="135" x2="1045" y2="135" stroke="#aaa" stroke-width="2"/><line x1="745" y1="135" x2="745" y2="170" stroke="#aaa" stroke-width="2"/><line x1="1045" y1="135" x2="1045" y2="170" stroke="#aaa" stroke-width="2"/><text x="745" y="205" font-size="30" fill="#242424" text-anchor="middle">site: A38</text><text x="1045" y="205" font-size="30" fill="#a71930" text-anchor="middle">counts</text><line x1="1045" y1="225" x2="1045" y2="265" stroke="#aaa" stroke-width="2"/><line x1="900" y1="265" x2="1170" y2="265" stroke="#aaa" stroke-width="2"/><text x="900" y="310" font-size="28" fill="#a71930" text-anchor="middle">cars: 182</text><text x="1170" y="310" font-size="28" fill="#a71930" text-anchor="middle">bicycles: 10</text><text x="700" y="390" font-size="28" fill="#242424" text-anchor="start">Keys and nesting organise the fields.</text></g></svg>
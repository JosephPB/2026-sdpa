<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img"><title>URL scheme, host, resource path and query in an illustrative REST request</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="45" font-size="40" fill="#242424" text-anchor="start">https://example.org/observations?site=A38</text><line x1="110" y1="75" x2="110" y2="150" stroke="#a71930" stroke-width="3"/><text x="110" y="195" font-size="30" fill="#a71930" text-anchor="middle">scheme</text><line x1="390" y1="75" x2="390" y2="150" stroke="#167b83" stroke-width="3"/><text x="390" y="195" font-size="30" fill="#167b83" text-anchor="middle">host</text><line x1="740" y1="75" x2="740" y2="150" stroke="#a71930" stroke-width="3"/><text x="740" y="195" font-size="30" fill="#a71930" text-anchor="middle">resource path</text><line x1="1100" y1="75" x2="1100" y2="150" stroke="#167b83" stroke-width="3"/><text x="1100" y="195" font-size="30" fill="#167b83" text-anchor="middle">query</text><text x="30" y="280" font-size="33" fill="#242424" text-anchor="start">A resource has a URL. A representation is returned.</text><text x="30" y="345" font-size="31" fill="#242424" text-anchor="start">Each request supplies the context the server needs.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img"><title>The public book page stores each price in a paragraph with class price_color</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a71930"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="34" fill="#242424" text-anchor="start">HTML from Books to Scrape</text><text x="20" y="95" font-size="29" fill="#a71930" text-anchor="start">&lt;article class=&quot;product_pod&quot;&gt;</text><text x="20" y="143" font-size="29" fill="#242424" text-anchor="start">  &lt;h3&gt;…&lt;/h3&gt;</text><text x="20" y="191" font-size="29" fill="#167b83" text-anchor="start">  &lt;p class=&quot;price_color&quot;&gt;</text><text x="20" y="239" font-size="29" fill="#167b83" text-anchor="start">    £51.77</text><text x="20" y="287" font-size="29" fill="#167b83" text-anchor="start">  &lt;/p&gt;</text><text x="20" y="335" font-size="29" fill="#a71930" text-anchor="start">&lt;/article&gt;</text><path d="M665,205 L765,205" stroke="#a71930" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="815" y="105" font-size="29" fill="#a71930" text-anchor="start">article.product_pod</text><text x="815" y="175" font-size="31" fill="#167b83" text-anchor="start">.price_color</text><text x="815" y="255" font-size="31" fill="#242424" text-anchor="start">text → &quot;£51.77&quot;</text><text x="815" y="330" font-size="29" fill="#242424" text-anchor="start">numeric price → 51.77</text></g></svg>
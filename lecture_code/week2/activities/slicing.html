<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python slicing board</title>
<link rel="stylesheet" href="slicing.css">
<script src="slicing-core.js" defer></script>
<script src="slicing.js" defer></script>
</head>
<body>
<main>
  <header>
    <label for="source">s = <input id="source" value="PYTHON" maxlength="40" spellcheck="false" autocomplete="off" aria-label="String to slice"></label>
    <div class="presets" aria-label="Example strings">
      <button type="button" data-text="PYTHON">PYTHON</button>
      <button type="button" data-text="D:080">D:080</button>
      <button type="button" data-text="  d:080  ">raw</button>
    </div>
    <button type="button" id="fullscreen" title="Show the activity full screen">Full screen</button>
  </header>
  <div id="characters" class="characters" aria-label="Characters with positive and negative indices"></div>
  <section class="builder" aria-label="Build an index or slice">
    <div class="expression-row">
      <span class="bracket">s[</span>
      <div id="slots" class="slots" aria-label="Slice expression tiles"></div>
      <span class="bracket">]</span>
      <button type="button" id="slice" class="primary">Slice</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <div class="palette" id="palette" aria-label="Number and colon tiles"></div>
    <div class="input-row">
      <label for="expression">Or type inside [ ] <input id="expression" value="" placeholder="e.g. :5:2" spellcheck="false" autocomplete="off"></label>
      <span>Drag tiles into a gap. Or tap a gap, then a tile. Tap a placed tile to remove it.</span>
    </div>
  </section>
  <section class="answer" aria-live="polite" aria-atomic="true">
    <output id="answer">Predict first, then press Slice.</output>
    <p id="explanation">Start included · stop excluded · default step 1</p>
  </section>
</main>
</body>
</html>

name: Deploy Robot Lab

on:
  push:
    branches: [main]
    paths:
      - 'additional_materials/robot-lab/**'
      - '.github/workflows/robot-lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: additional_materials/robot-lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: additional_materials/robot-lab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: additional_materials/robot-lab/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
